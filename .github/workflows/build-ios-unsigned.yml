name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/zhfr-*']
    paths:
      - 'ios-native/**'
      - 'api/translate.js'
      - '.github/workflows/build-ios-unsigned.yml'

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Check sentence recording regressions
        working-directory: ios-native
        run: |
          swiftc \
            ZHFRLive/Models/TranscriptLine.swift \
            ZHFRLive/Services/LanguageDetector.swift \
            ZHFRLive/Services/SentenceAssembler.swift \
            ZHFRLive/Services/TranslationEventBuffer.swift \
            ZHFRLive/Services/TranslationBindings.swift \
            ZHFRLive/Services/MicrophoneSignalProcessor.swift \
            ZHFRLive/Services/TranscriptWindow.swift \
            ZHFRLive/Services/PhraseTranslator.swift \
            ZHFRLive/Services/RecognitionOptions.swift \
            ZHFRLive/Services/LocalModelCache.swift \
            Tests/main.swift \
            -o "$RUNNER_TEMP/zhfr-sentence-tests"
          "$RUNNER_TEMP/zhfr-sentence-tests"

      - name: Check text-only translation and failure handling
        working-directory: ios-native
        run: |
          node Tests/translate-backend.mjs
          swiftc -parse-as-library \
            ZHFRLive/Models/TranscriptLine.swift \
            ZHFRLive/Services/TextTranslationService.swift \
            Tests/TextTranslationSmoke.swift \
            -o "$RUNNER_TEMP/zhfr-text-translation-tests"
          "$RUNNER_TEMP/zhfr-text-translation-tests"

      - name: Check deployed text translation in both directions
        if: contains(github.event.head_commit.message, '[check-text-translation]')
        env:
          ZHFR_CHECK_TEXT_TRANSLATION: '1'
        run: '"$RUNNER_TEMP/zhfr-text-translation-tests"'

      - name: Check actual bilingual speech and live translation
        if: contains(github.event.head_commit.message, '[check-bilingual-asr]')
        working-directory: ios-native
        env:
          ZHFR_CHECK_LIVE_TRANSLATION: '1'
        run: bash Tests/run-language-smoke.sh

      - name: Generate Xcode project
        working-directory: ios-native
        run: xcodegen generate

      - name: Resolve Swift packages
        working-directory: ios-native
        run: |
          xcodebuild -resolvePackageDependencies \
            -project ZHFRLive.xcodeproj \
            -scheme ZHFRLive

      - name: Build unsigned device app
        working-directory: ios-native
        run: |
          set -o pipefail
          xcodebuild \
            -project ZHFRLive.xcodeproj \
            -scheme ZHFRLive \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build | tee xcodebuild.log

      - name: Package unsigned IPA
        working-directory: ios-native
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo 'No .app found'
            exit 1
          fi
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          /usr/bin/zip -qry ZHFRLive-unsigned.ipa Payload
          ls -lh ZHFRLive-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ZHFRLive-unsigned-ipa
          path: ios-native/ZHFRLive-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ZHFRLive-build-log
          path: ios-native/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
